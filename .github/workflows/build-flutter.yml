name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build/job ID"
        required: true
        type: string

      userId:
        description: "User ID"
        required: false
        default: "0"
        type: string

      payload:
        description: "JSON build payload"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: scbuild-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # PARSE PAYLOAD
      # ============================================================

      - name: Parse payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["PAYLOAD"])

          mode = str(data.get("mode", "zip")).lower()
          build_type = str(data.get("buildType", "release")).lower()
          url = str(data.get("url", "")).strip()
          app_name = str(data.get("appName", "Web2APK")).strip()

          if mode not in ("zip", "url"):
              raise SystemExit(f"Unsupported mode: {mode}")

          if build_type not in ("release", "debug"):
              build_type = "release"

          if not url:
              raise SystemExit("payload.url is required")

          safe = "".join(
              c if c.isalnum() else "_"
              for c in app_name
          )

          safe = safe.strip("_") or "web2apk"

          if safe[0].isdigit():
              safe = "app_" + safe

          safe = safe[:40].lower()

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mode={mode}\n")
              f.write(f"build_type={build_type}\n")
              f.write(f"url={url}\n")
              f.write(f"app_name={app_name}\n")
              f.write(f"project_name={safe}\n")
          PY


      # ============================================================
      # SYSTEM
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            jq \
            python3 \
            file \
            sed


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Check environment
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version


      # ============================================================
      # DOWNLOAD SOURCE
      # ============================================================

      - name: Download source ZIP
        if: steps.payload.outputs.mode == 'zip'
        env:
          SOURCE_URL: ${{ steps.payload.outputs.url }}

        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/input"
          mkdir -p "$GITHUB_WORKSPACE/project"

          echo "Downloading:"
          echo "$SOURCE_URL"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$SOURCE_URL" \
            -o "$GITHUB_WORKSPACE/input/source.zip"

          test -s "$GITHUB_WORKSPACE/input/source.zip"

          unzip -q \
            "$GITHUB_WORKSPACE/input/source.zip" \
            -d "$GITHUB_WORKSPACE/project"

          ROOT="$(
            find "$GITHUB_WORKSPACE/project" \
              -name pubspec.yaml \
              -type f \
              -print \
              -quit |
              xargs -r dirname
          )"

          if [ -z "${ROOT:-}" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."

            find "$GITHUB_WORKSPACE/project" \
              -maxdepth 6 \
              -type f |
              head -300

            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT ROOT:"
          echo "$ROOT"
          echo "================================"


      # ============================================================
      # URL MODE
      # ============================================================

      - name: Create Web2APK project
        if: steps.payload.outputs.mode == 'url'

        env:
          PROJECT_NAME: ${{ steps.payload.outputs.project_name }}
          APP_NAME: ${{ steps.payload.outputs.app_name }}
          TARGET_URL: ${{ steps.payload.outputs.url }}

        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          flutter create \
            --platforms=android \
            "$PROJECT_NAME"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/$PROJECT_NAME" >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE/$PROJECT_NAME"

          flutter pub add webview_flutter

          python3 - <<'PY'
          from pathlib import Path
          import os

          url = os.environ["TARGET_URL"]
          app = os.environ["APP_NAME"]

          url = url.replace("\\", "\\\\").replace("'", "\\'")
          app = app.replace("\\", "\\\\").replace("'", "\\'")

          code = f"""
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {{
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebApp());
          }}

          class WebApp extends StatefulWidget {{
            const WebApp({{super.key}});

            @override
            State<WebApp> createState() => _WebAppState();
          }}

          class _WebAppState extends State<WebApp> {{
            late final WebViewController controller;

            @override
            void initState() {{
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(
                  Uri.parse('{url}')
                );
            }}

            @override
            Widget build(BuildContext context) {{
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '{app}',
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(
                      controller: controller,
                    ),
                  ),
                ),
              );
            }}
          }}
          """

          Path("lib/main.dart").write_text(
              code,
              encoding="utf-8"
          )
          PY


      # ============================================================
      # FIX ANDROID GRADLE
      # ============================================================

      - name: Fix Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          find android -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) \
            -print


          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          mkdir -p android

          touch android/gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")

          text = p.read_text(
              encoding="utf-8",
              errors="replace"
          )

          text = text.replace("\r\n", "\n")
          text = text.replace("\r", "\n")

          # Fix corruption from previous workflow
          text = text.replace(
              "falseandroid.newDsl=false",
              "false\nandroid.newDsl=false"
          )

          text = text.replace(
              "falseandroid.builtInKotlin=false",
              "false\nandroid.builtInKotlin=false"
          )

          lines = []

          for line in text.split("\n"):

              stripped = line.strip()

              if stripped.startswith("android.newDsl="):
                  continue

              if stripped.startswith("android.builtInKotlin="):
                  continue

              lines.append(line)

          while lines and not lines[-1].strip():
              lines.pop()

          lines.append("android.newDsl=false")
          lines.append("android.builtInKotlin=false")

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY


          # --------------------------------------------------------
          # settings.gradle / settings.gradle.kts
          # --------------------------------------------------------

          if [ -f android/settings.gradle.kts ]; then

            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")
          s = p.read_text(encoding="utf-8")

          # AGP 9.x -> AGP 8.7.3
          s = re.sub(
              r'id\(["\']com\.android\.application["\']\)\s+version\s+["\']9\.[^"\']+["\']',
              'id("com.android.application") version "8.7.3"',
              s
          )

          s = re.sub(
              r'id\(["\']com\.android\.library["\']\)\s+version\s+["\']9\.[^"\']+["\']',
              'id("com.android.library") version "8.7.3"',
              s
          )

          p.write_text(s, encoding="utf-8")
          PY

          fi


          if [ -f android/settings.gradle ]; then

            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'id\s+["\']com\.android\.application["\']\s+version\s+["\']9\.[^"\']+["\']',
              'id "com.android.application" version "8.7.3"',
              s
          )

          s = re.sub(
              r'id\s+["\']com\.android\.library["\']\s+version\s+["\']9\.[^"\']+["\']',
              'id "com.android.library" version "8.7.3"',
              s
          )

          p.write_text(s, encoding="utf-8")
          PY

          fi


          # --------------------------------------------------------
          # gradle-wrapper.properties
          # --------------------------------------------------------

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            sed -i \
              -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties

          fi


          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------

          echo ""
          echo "======================================"
          echo "gradle.properties"
          echo "======================================"

          cat -n android/gradle.properties

          echo ""
          echo "======================================"
          echo "gradle-wrapper.properties"
          echo "======================================"

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo ""
          echo "======================================"
          echo "settings.gradle"
          echo "======================================"

          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            cat android/settings.gradle.kts
          fi


          # HARD CHECK
          if grep -Rqs \
            "android.enableJetifier=falseandroid" \
            android; then

            echo "::error::gradle.properties corrupt."
            exit 1
          fi

          if ! grep -qx \
            "android.newDsl=false" \
            android/gradle.properties; then

            echo "::error::android.newDsl=false missing."
            exit 1
          fi


      # ============================================================
      # ANDROID APP CONFIG
      # ============================================================

      - name: Configure Android app
        env:
          APP_NAME: ${{ steps.payload.outputs.app_name }}

        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          name = os.environ["APP_NAME"]

          name = (
              name
              .replace("\\", "\\\\")
              .replace('"', '\\"')
          )


          # --------------------------------------------------------
          # Manifest
          # --------------------------------------------------------

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():

              s = manifest.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'android:label="[^"]*"',
                  f'android:label="{name}"',
                  s,
                  count=1
              )

              manifest.write_text(
                  s,
                  encoding="utf-8"
              )


          # --------------------------------------------------------
          # build.gradle
          # --------------------------------------------------------

          gradle = Path(
              "android/app/build.gradle"
          )

          if gradle.exists():

              s = gradle.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'minSdkVersion\s+\d+',
                  'minSdkVersion 21',
                  s
              )

              gradle.write_text(
                  s,
                  encoding="utf-8"
              )


          # --------------------------------------------------------
          # build.gradle.kts
          # --------------------------------------------------------

          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          if gradle_kts.exists():

              s = gradle_kts.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'minSdk\s*=\s*\d+',
                  'minSdk = 21',
                  s
              )

              gradle_kts.write_text(
                  s,
                  encoding="utf-8"
              )
          PY


      # ============================================================
      # GRADLE CACHE
      # ============================================================

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}

          restore-keys: |
            gradle-${{ runner.os }}-


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter clean

          rm -rf .dart_tool
          rm -rf build


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter pub get


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}

        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug \
              --no-tree-shake-icons

          else

            flutter build apk \
              --release \
              --no-tree-shake-icons

          fi


      # ============================================================
      # COLLECT APK
      # ============================================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(
            find "$PROJECT_ROOT/build/app/outputs/flutter-apk" \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "${APK:-}" ]; then

            echo "::error::APK tidak ditemukan."

            find "$PROJECT_ROOT/build" \
              -type f 2>/dev/null |
              head -300

            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

          echo \
            "APK=$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk" \
            >> "$GITHUB_ENV"

          ls -lh \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4

        with:
          name: apk-${{ inputs.jobId }}

          path: |
            output/app-${{ inputs.jobId }}.apk

          if-no-files-found: error
          retention-days: 3


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SCBUILD DAZZ"
            echo ""
            echo "- Job ID: \`${JOB_ID}\`"
            echo "- User ID: \`${USER_ID}\`"
            echo "- Mode: \`${{ steps.payload.outputs.mode }}\`"
            echo "- Build type: \`${{ steps.payload.outputs.build_type }}\`"

            if [ -f "${APK:-}" ]; then
              echo "- APK size: $(du -h "$APK" | cut -f1)"
            fi

          } >> "$GITHUB_STEP_SUMMARY"
