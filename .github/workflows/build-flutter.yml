name: SCBUILD DAZZ

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Build Job ID"
        required: true
        type: string
      userId:
        description: "User ID"
        required: false
        default: "0"
        type: string
      payload:
        description: "Build payload JSON"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scbuild-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}

    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl wget jq python3 file

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Flutter is pinned. Do not use an unpinned "stable" channel because
      # Flutter/Gradle compatibility can change when stable moves.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FLUTTER ==="
          flutter --version
          echo "=== DART ==="
          dart --version
          echo "=== JAVA ==="
          java -version
          echo "=== GRADLE/JAVA HOME ==="
          echo "$JAVA_HOME"

      - name: Parse build payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          raw = os.environ["PAYLOAD"]
          data = json.loads(raw)

          mode = str(data.get("mode", "zip")).strip().lower()
          url = str(data.get("url", "")).strip()
          build_type = str(data.get("buildType", "release")).strip().lower()

          if mode != "zip":
              raise SystemExit("This workflow expects payload.mode=zip")

          if not url:
              raise SystemExit("payload.url is required")

          if build_type not in ("release", "debug"):
              build_type = "release"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"mode={mode}\n")
              f.write(f"url={url}\n")
              f.write(f"build_type={build_type}\n")
          PY

      - name: Download source ZIP
        env:
          SOURCE_URL: ${{ steps.payload.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/input" "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/input" "$GITHUB_WORKSPACE/project"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$SOURCE_URL" \
            -o "$GITHUB_WORKSPACE/input/source.zip"

          test -s "$GITHUB_WORKSPACE/input/source.zip"

          unzip -q "$GITHUB_WORKSPACE/input/source.zip" \
            -d "$GITHUB_WORKSPACE/project"

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(find "$GITHUB_WORKSPACE/project" \
            -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "${ROOT:-}" ]; then
            echo "::error::pubspec.yaml was not found in source ZIP."
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$ROOT"

      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ ! -d android ]; then
            echo "::error::Flutter project has no android directory."
            exit 1
          fi

          echo "=== PROJECT FILES ==="
          ls -la

          echo "=== ANDROID FILES ==="
          find android -maxdepth 3 -type f \
            \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' -o -name 'gradle-wrapper.properties' \) \
            -print | sort

          echo "=== PUBSPEC ==="
          sed -n '1,220p' pubspec.yaml

      - name: Apply Flutter Android compatibility flags
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          mkdir -p android
          touch android/gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")

          text = p.read_text(
              encoding="utf-8",
              errors="replace"
          ).replace("\r\n", "\n").replace("\r", "\n")

          # Remove only duplicate copies of these two compatibility flags.
          # Do not rewrite AGP/Kotlin/Gradle versions from the source project.
          kept = []
          for line in text.splitlines():
              stripped = line.strip()
              if stripped.startswith("android.newDsl="):
                  continue
              if stripped.startswith("android.builtInKotlin="):
                  continue
              kept.append(line)

          # Flutter's error specifically asks for the new Android DSL opt-out
          # when using a project that has not migrated to the new DSL.
          kept.append("android.newDsl=false")

          # Keep built-in Kotlin disabled for older project structures.
          kept.append("android.builtInKotlin=false")

          p.write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY

          echo "=== FINAL gradle.properties ==="
          cat android/gradle.properties

      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=== AGP REFERENCES ==="
          grep -RInE \
            'com\.android\.(application|library)|com\.android\.tools\.build:gradle' \
            android \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            2>/dev/null || true

          echo "=== KOTLIN REFERENCES ==="
          grep -RInE \
            'org\.jetbrains\.kotlin|kotlin\("android"\)|kotlin_version' \
            android \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            2>/dev/null || true

          echo "=== WRAPPER ==="
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            cat android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "No Gradle wrapper supplied by source."
          fi

      - name: Repair missing Gradle wrapper only if necessary
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ -x android/gradlew ]; then
            echo "Source Gradle wrapper exists; keeping it unchanged."
            exit 0
          fi

          echo "Source has no executable Gradle wrapper."
          mkdir -p android/gradle/wrapper

          GRADLE_VERSION="8.11.1"
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            rm -rf "$GRADLE_HOME"

            curl -fL \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 900 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$RUNNER_TEMP/gradle.zip"

            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/gradle-$GRADLE_VERSION" "$GRADLE_HOME"
          fi

          cat > android/gradlew <<EOF
          #!/bin/sh
          set -e
          exec "$GRADLE_HOME/bin/gradle" "\$@"
          EOF

          chmod +x android/gradlew

          echo "Created fallback Gradle wrapper using Gradle $GRADLE_VERSION."

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          flutter clean
          rm -rf .dart_tool build

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk \
              --debug \
              --no-tree-shake-icons
          else
            flutter build apk \
              --release \
              --no-tree-shake-icons
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(find "$PROJECT_ROOT/build/app/outputs/flutter-apk" \
            -type f -name '*.apk' \
            -print -quit)"

          if [ -z "${APK:-}" ]; then
            echo "::error::No APK was produced."
            find "$PROJECT_ROOT/build" -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

          echo "APK=$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk" >> "$GITHUB_ENV"

          ls -lh "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/app-${{ inputs.jobId }}.apk
          if-no-files-found: error
          retention-days: 3

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SCBUILD DAZZ"
            echo ""
            echo "- Job ID: \`${JOB_ID}\`"
            echo "- User ID: \`${USER_ID}\`"
            echo "- Mode: \`${{ steps.payload.outputs.mode }}\`"
            echo "- Build type: \`${{ steps.payload.outputs.build_type }}\`"
            if [ -n "${APK:-}" ] && [ -f "$APK" ]; then
              echo "- APK size: $(du -h "$APK" | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
