name: SCBUILD DAZZ

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Build Job ID"
        required: true
        type: string

      userId:
        description: "User ID"
        required: false
        default: "0"
        type: string

      payload:
        description: "Build payload JSON"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scbuild-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            wget \
            jq \
            python3 \
            file


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          java -version


      # ==========================================================
      # PARSE PAYLOAD
      # ==========================================================

      - name: Parse payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["PAYLOAD"])

          mode = str(
              data.get("mode", "zip")
          ).lower()

          url = str(
              data.get("url", "")
          ).strip()

          build_type = str(
              data.get("buildType", "release")
          ).lower()

          app_name = str(
              data.get("appName", "Web2APK")
          ).strip()

          if mode not in ("zip", "url"):
              raise SystemExit(
                  f"Unsupported mode: {mode}"
              )

          if not url:
              raise SystemExit(
                  "payload.url is required"
              )

          if build_type not in ("release", "debug"):
              build_type = "release"

          safe = "".join(
              c if c.isalnum() else "_"
              for c in app_name
          )

          safe = safe.strip("_") or "web2apk"

          if safe[0].isdigit():
              safe = "app_" + safe

          safe = safe[:40].lower()

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:

              f.write(f"mode={mode}\n")
              f.write(f"url={url}\n")
              f.write(f"build_type={build_type}\n")
              f.write(f"app_name={app_name}\n")
              f.write(f"project_name={safe}\n")
          PY


      # ==========================================================
      # ZIP MODE
      # ==========================================================

      - name: Download source ZIP
        if: steps.payload.outputs.mode == 'zip'

        env:
          SOURCE_URL: ${{ steps.payload.outputs.url }}

        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/input" \
            "$GITHUB_WORKSPACE/project"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$SOURCE_URL" \
            -o "$GITHUB_WORKSPACE/input/source.zip"

          test -s \
            "$GITHUB_WORKSPACE/input/source.zip"

          unzip -q \
            "$GITHUB_WORKSPACE/input/source.zip" \
            -d "$GITHUB_WORKSPACE/project"

          ROOT="$(
            find \
              "$GITHUB_WORKSPACE/project" \
              -type f \
              -name "pubspec.yaml" \
              -print \
              -quit |
              xargs -r dirname
          )"

          if [ -z "${ROOT:-}" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" \
            >> "$GITHUB_ENV"

          echo "PROJECT ROOT:"
          echo "$ROOT"


      # ==========================================================
      # URL MODE
      # ==========================================================

      - name: Create Web2APK project
        if: steps.payload.outputs.mode == 'url'

        env:
          PROJECT_NAME: ${{ steps.payload.outputs.project_name }}
          APP_NAME: ${{ steps.payload.outputs.app_name }}
          TARGET_URL: ${{ steps.payload.outputs.url }}

        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          flutter create \
            --platforms=android \
            "$PROJECT_NAME"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/$PROJECT_NAME" \
            >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE/$PROJECT_NAME"

          flutter pub add webview_flutter

          python3 - <<'PY'
          from pathlib import Path
          import os

          url = os.environ["TARGET_URL"]
          app = os.environ["APP_NAME"]

          url = (
              url
              .replace("\\", "\\\\")
              .replace("'", "\\'")
          )

          app = (
              app
              .replace("\\", "\\\\")
              .replace("'", "\\'")
          )

          Path("lib/main.dart").write_text(
              f"""
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {{
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebApp());
          }}

          class WebApp extends StatefulWidget {{
            const WebApp({{super.key}});

            @override
            State<WebApp> createState() => _WebAppState();
          }}

          class _WebAppState extends State<WebApp> {{

            late final WebViewController controller;

            @override
            void initState() {{
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..loadRequest(
                  Uri.parse('{url}'),
                );
            }}

            @override
            Widget build(BuildContext context) {{
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '{app}',
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(
                      controller: controller,
                    ),
                  ),
                ),
              );
            }}
          }}
          """,
              encoding="utf-8"
          )
          PY


      # ==========================================================
      # FIX ANDROID
      # ==========================================================

      - name: Fix Android Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "ANDROID GRADLE CONFIG"
          echo "=========================================="


          # ------------------------------------------------------
          # KEEP AGP 8.9.1
          #
          # IMPORTANT:
          # Do NOT downgrade 8.9.1.
          # ------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android")

          files = []

          for pattern in (
              "*.gradle",
              "*.gradle.kts",
              "*.toml"
          ):
              files.extend(
                  root.rglob(pattern)
              )

          for p in files:

              try:
                  text = p.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              except Exception:
                  continue

              original = text

              # Only convert REAL AGP 9.x.
              # 8.9.1 MUST remain 8.9.1.

              text = re.sub(
                  r'(com\.android\.application["\']?\s*\)?\s*version\s*["\'])9\.[0-9.]+(["\'])',
                  r'\g<1>8.9.1\g<2>',
                  text
              )

              text = re.sub(
                  r'(com\.android\.library["\']?\s*\)?\s*version\s*["\'])9\.[0-9.]+(["\'])',
                  r'\g<1>8.9.1\g<2>',
                  text
              )

              text = re.sub(
                  r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])9\.[0-9.]+(["\'])',
                  r'\g<1>8.9.1\g<2>',
                  text
              )

              text = re.sub(
                  r'(id\s+["\']com\.android\.library["\']\s+version\s+["\'])9\.[0-9.]+(["\'])',
                  r'\g<1>8.9.1\g<2>',
                  text
              )

              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)\s*9\.[0-9.]+',
                  r'\g<1>8.9.1',
                  text
              )

              text = re.sub(
                  r'(\bagp\s*=\s*["\'])9\.[0-9.]+(["\'])',
                  r'\g<1>8.9.1\g<2>',
                  text
              )

              if text != original:

                  p.write_text(
                      text,
                      encoding="utf-8"
                  )

                  print(
                      "Fixed real AGP 9 reference:",
                      p
                  )
          PY


          # ------------------------------------------------------
          # GRADLE PROPERTIES
          # ------------------------------------------------------

          touch android/gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")

          text = p.read_text(
              encoding="utf-8",
              errors="replace"
          )

          text = text.replace(
              "\r\n",
              "\n"
          )

          text = text.replace(
              "\r",
              "\n"
          )

          lines = []

          for line in text.splitlines():

              stripped = line.strip()

              if stripped.startswith(
                  "android.newDsl="
              ):
                  continue

              if stripped.startswith(
                  "android.builtInKotlin="
              ):
                  continue

              lines.append(line)

          lines.append(
              "android.newDsl=false"
          )

          lines.append(
              "android.builtInKotlin=false"
          )

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY


          # ------------------------------------------------------
          # GRADLE WRAPPER
          # ------------------------------------------------------

          mkdir -p \
            android/gradle/wrapper

          cat > \
            android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF


          # ------------------------------------------------------
          # GRADLE 8.11.1
          # ------------------------------------------------------

          GRADLE_DIR="$RUNNER_TEMP/gradle-fixed"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then

            rm -rf "$GRADLE_DIR"

            curl \
              -fL \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 900 \
              "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" \
              -o "$RUNNER_TEMP/gradle.zip"

            unzip -q \
              "$RUNNER_TEMP/gradle.zip" \
              -d "$RUNNER_TEMP"

            mv \
              "$RUNNER_TEMP/gradle-8.11.1" \
              "$GRADLE_DIR"

          fi


          # ------------------------------------------------------
          # GRADLEW
          # ------------------------------------------------------

          cat > android/gradlew <<'EOF'
          #!/bin/sh

          set -e

          exec \
            "${RUNNER_TEMP}/gradle-fixed/bin/gradle" \
            "$@"
          EOF

          chmod +x android/gradlew


          # ======================================================
          # SHOW CONFIG
          # ======================================================

          echo ""
          echo "=========================================="
          echo "AGP CONFIGURATION"
          echo "=========================================="

          grep -RInE \
            'com\.android\.(application|library)|com\.android\.tools\.build|agp[[:space:]]*=' \
            android \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            2>/dev/null || true


          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          "$GRADLE_DIR/bin/gradle" --version


          # ======================================================
          # PRECISE AGP 9 CHECK
          #
          # IMPORTANT:
          # This extracts actual plugin versions.
          # Therefore 8.9.1 will NOT be mistaken for 9.x.
          # ======================================================

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("android")

          bad = []

          patterns = [
              re.compile(
                  r'com\.android\.application.*?version\s*["\'](\d+)\.(\d+)\.(\d+)'
              ),
              re.compile(
                  r'com\.android\.library.*?version\s*["\'](\d+)\.(\d+)\.(\d+)'
              ),
          ]

          for p in root.rglob("*"):

              if p.suffix not in (
                  ".gradle",
                  ".kts",
                  ".toml"
              ):
                  continue

              try:
                  text = p.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              except Exception:
                  continue

              for pattern in patterns:

                  for match in pattern.finditer(text):

                      major = int(
                          match.group(1)
                      )

                      version = (
                          f"{match.group(1)}."
                          f"{match.group(2)}."
                          f"{match.group(3)}"
                      )

                      print(
                          f"Detected AGP {version} "
                          f"in {p}"
                      )

                      if major >= 9:

                          bad.append(
                              f"{p}: AGP {version}"
                          )

          if bad:

              print("")
              print(
                  "::error::Actual AGP 9.x detected:"
              )

              for item in bad:
                  print(item)

              sys.exit(1)

          print("")
          print(
              "No AGP 9.x detected."
          )

          PY


          echo ""
          echo "=========================================="
          echo "ANDROID CONFIGURATION OK"
          echo "=========================================="
          echo "AGP    : 8.9.1"
          echo "Gradle : 8.11.1"
          echo "newDsl : false"
          echo "=========================================="


      # ==========================================================
      # FLUTTER CLEAN
      # ==========================================================

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter clean

          rm -rf \
            .dart_tool \
            build


      # ==========================================================
      # PUB GET
      # ==========================================================

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter pub get


      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}

        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug \
              --no-tree-shake-icons

          else

            flutter build apk \
              --release \
              --no-tree-shake-icons

          fi


      # ==========================================================
      # COLLECT APK
      # ==========================================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/output"

          APK="$(
            find \
              "$PROJECT_ROOT/build/app/outputs/flutter-apk" \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "${APK:-}" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

          echo \
            "APK=$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk" \
            >> "$GITHUB_ENV"

          echo ""
          echo "APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"


      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/app-${{ inputs.jobId }}.apk
          if-no-files-found: error
          retention-days: 3


      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SCBUILD DAZZ"
            echo ""
            echo "- Job ID: \`${JOB_ID}\`"
            echo "- User ID: \`${USER_ID}\`"
            echo "- Mode: \`${{ steps.payload.outputs.mode }}\`"
            echo "- Build type: \`${{ steps.payload.outputs.build_type }}\`"

            if [ -f "${APK:-}" ]; then
              echo "- APK size: $(du -h "$APK" | cut -f1)"
            fi

          } >> "$GITHUB_STEP_SUMMARY"
