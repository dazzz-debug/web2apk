name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build/job ID"
        required: true
        type: string

      userId:
        description: "User ID"
        required: false
        default: "0"
        type: string

      payload:
        description: "JSON build payload"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: scbuild-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # PARSE PAYLOAD
      # ============================================================

      - name: Parse payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["PAYLOAD"])

          mode = str(
              data.get("mode", "zip")
          ).lower()

          build_type = str(
              data.get("buildType", "release")
          ).lower()

          url = str(
              data.get("url", "")
          ).strip()

          app_name = str(
              data.get("appName", "Web2APK")
          ).strip()

          icon_url = str(
              data.get("iconUrl", "")
          ).strip()

          if mode not in ("zip", "url"):
              raise SystemExit(
                  f"Unsupported mode: {mode}"
              )

          if build_type not in ("release", "debug"):
              build_type = "release"

          if not url:
              raise SystemExit(
                  "payload.url is required"
              )

          safe = "".join(
              c if c.isalnum() else "_"
              for c in app_name
          )

          safe = safe.strip("_") or "web2apk"

          if safe[0].isdigit():
              safe = "app_" + safe

          safe = safe[:40].lower()

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(
                  f"mode={mode}\n"
              )

              f.write(
                  f"build_type={build_type}\n"
              )

              f.write(
                  f"url={url}\n"
              )

              f.write(
                  f"app_name={app_name}\n"
              )

              f.write(
                  f"icon_url={icon_url}\n"
              )

              f.write(
                  f"project_name={safe}\n"
              )
          PY

      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            jq \
            python3 \
            file \
            imagemagick

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check environment
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version

      # ============================================================
      # ZIP MODE
      # ============================================================

      - name: Download source ZIP
        if: steps.payload.outputs.mode == 'zip'
        env:
          SOURCE_URL: ${{ steps.payload.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/input"
          mkdir -p "$GITHUB_WORKSPACE/project"

          echo "Downloading source ZIP..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$SOURCE_URL" \
            -o "$GITHUB_WORKSPACE/input/source.zip"

          if [ ! -s "$GITHUB_WORKSPACE/input/source.zip" ]; then
            echo "::error::Source ZIP kosong."
            exit 1
          fi

          echo "Extracting source..."

          unzip -q \
            "$GITHUB_WORKSPACE/input/source.zip" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Searching pubspec.yaml..."

          ROOT="$(
            find \
              "$GITHUB_WORKSPACE/project" \
              -name pubspec.yaml \
              -type f \
              -print -quit |
            xargs -r dirname
          )"

          if [ -z "${ROOT:-}" ]; then

            echo "::error::pubspec.yaml tidak ditemukan."

            echo "SOURCE CONTENT:"
            find \
              "$GITHUB_WORKSPACE/project" \
              -maxdepth 5 \
              -type f |
            head -300

            exit 1
          fi

          echo "======================================"
          echo "FLUTTER PROJECT:"
          echo "$ROOT"
          echo "======================================"

          echo "PROJECT_ROOT=$ROOT" \
            >> "$GITHUB_ENV"

      # ============================================================
      # URL MODE
      # ============================================================

      - name: Create Web2APK project
        if: steps.payload.outputs.mode == 'url'
        env:
          PROJECT_NAME: ${{ steps.payload.outputs.project_name }}
          APP_NAME: ${{ steps.payload.outputs.app_name }}
          TARGET_URL: ${{ steps.payload.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          flutter create \
            --platforms=android \
            "$PROJECT_NAME"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/$PROJECT_NAME" \
            >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE/$PROJECT_NAME"

          flutter pub add webview_flutter

          python3 - <<'PY'
          from pathlib import Path
          import os

          url = os.environ["TARGET_URL"]
          app = os.environ["APP_NAME"]

          url = (
              url
              .replace("\\", "\\\\")
              .replace("'", "\\'")
          )

          app = (
              app
              .replace("\\", "\\\\")
              .replace("'", "\\'")
          )

          code = f"""
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {{
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebApp());
          }}

          class WebApp extends StatefulWidget {{
            const WebApp({{super.key}});

            @override
            State<WebApp> createState() => _WebAppState();
          }}

          class _WebAppState extends State<WebApp> {{
            late final WebViewController controller;

            @override
            void initState() {{
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onWebResourceError: (error) {{
                      debugPrint(
                        error.description
                      );
                    }},
                  ),
                )
                ..loadRequest(
                  Uri.parse('{url}')
                );
            }}

            @override
            Widget build(BuildContext context) {{
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '{app}',
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(
                      controller: controller,
                    ),
                  ),
                ),
              );
            }}
          }}
          """

          Path(
              "lib/main.dart"
          ).write_text(
              code,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # AGP 9 COMPATIBILITY FIX
      # ============================================================

      - name: Fix Flutter AGP 9 compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          mkdir -p android

          touch android/gradle.properties

          # Remove old/conflicting values
          sed -i \
            '/^[[:space:]]*android\.newDsl[[:space:]]*=/d' \
            android/gradle.properties || true

          sed -i \
            '/^[[:space:]]*android\.builtInKotlin[[:space:]]*=/d' \
            android/gradle.properties || true

          # AGP 9 compatibility
          echo "android.newDsl=false" \
            >> android/gradle.properties

          echo "android.builtInKotlin=false" \
            >> android/gradle.properties

          echo ""
          echo "===== android/gradle.properties ====="
          cat android/gradle.properties
          echo "======================================"

      # ============================================================
      # ANDROID CONFIG
      # ============================================================

      - name: Configure Android
        env:
          APP_NAME: ${{ steps.payload.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          name = os.environ["APP_NAME"]

          name = (
              name
              .replace("\\", "\\\\")
              .replace('"', '\\"')
          )

          # AndroidManifest
          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():

              s = manifest.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'android:label="[^"]*"',
                  f'android:label="{name}"',
                  s,
                  count=1
              )

              manifest.write_text(
                  s,
                  encoding="utf-8"
              )

          # Groovy Gradle
          gradle = Path(
              "android/app/build.gradle"
          )

          if gradle.exists():

              s = gradle.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'minSdkVersion\s+\d+',
                  'minSdkVersion 21',
                  s
              )

              gradle.write_text(
                  s,
                  encoding="utf-8"
              )

          # Kotlin Gradle
          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          if gradle_kts.exists():

              s = gradle_kts.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'minSdk\s*=\s*\d+',
                  'minSdk = 21',
                  s
              )

              gradle_kts.write_text(
                  s,
                  encoding="utf-8"
              )
          PY

      # ============================================================
      # GRADLE CACHE
      # ============================================================

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      # DOWNLOAD DEPENDENCIES
      # ============================================================

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter clean

          rm -rf .dart_tool
          rm -rf build

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter pub get

      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Analyze project
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          dart format lib || true

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings || true

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "BUILD TYPE: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug \
              --no-tree-shake-icons

          else

            flutter build apk \
              --release \
              --no-tree-shake-icons

          fi

      # ============================================================
      # FIND APK
      # ============================================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(
            find \
              "$PROJECT_ROOT/build/app/outputs/flutter-apk" \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "${APK:-}" ]; then

            echo "::error::APK hasil build tidak ditemukan."

            echo "BUILD DIRECTORY:"
            find \
              "$PROJECT_ROOT/build" \
              -type f 2>/dev/null |
            head -300

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

          echo "APK=$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk" \
            >> "$GITHUB_ENV"

          echo ""
          echo "FINAL APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/app-${{ inputs.jobId }}.apk
          if-no-files-found: error
          retention-days: 3

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SCBUILD DAZZ"
            echo ""
            echo "- Job ID: \`${JOB_ID}\`"
            echo "- User ID: \`${USER_ID}\`"
            echo "- Mode: \`${{ steps.payload.outputs.mode }}\`"
            echo "- Build type: \`${{ steps.payload.outputs.build_type }}\`"

            if [ -f "${APK:-}" ]; then
              echo "- APK size: $(du -h "$APK" | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
