name: Build Flutter APK (Fallback Worker)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'
          cache: true

      # Cache Dart packages between builds. The project arrives as a ZIP,
      # so use a run-specific key with a stable restore prefix.
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-3.38.0-${{ github.run_id }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-3.38.0-

      # Reuse Gradle dependencies and wrapper distributions across runs.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk17-

      - name: Prepare Project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo '${{ github.event.inputs.payload }}' > payload.json
          cat payload.json

          ASSET_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)

          if [ -z "$ASSET_URL" ]; then
            echo "::error::Tidak ada zipAssetUrl atau url di payload. Isi payload:"
            cat payload.json
            exit 1
          fi

          echo "Downloading project source from: $ASSET_URL"

          rm -rf project project.zip
          mkdir -p project

          if [[ "$ASSET_URL" == *"api.github.com"* ]]; then
            curl -fL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o project.zip \
              "$ASSET_URL"
          else
            curl -fL -o project.zip "$ASSET_URL"
          fi

          unzip -q project.zip -d project

          PUBSPEC=$(find project -maxdepth 5 -type f -name pubspec.yaml | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP. Pastikan ini project Flutter yang valid."
            find project -maxdepth 3
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected Flutter project root: $PROJECT_ROOT"

      - name: Determine Build Type
        run: |
          set -e
          BUILD_TYPE=$(jq -r '.buildType // .payload.buildType // "release"' payload.json)
          if [ "$BUILD_TYPE" != "debug" ] && [ "$BUILD_TYPE" != "release" ]; then
            echo "::error::Build type tidak valid: $BUILD_TYPE"
            exit 1
          fi
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "Build type: $BUILD_TYPE"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_ROOT"
          # The source is freshly extracted for each job, so `flutter clean`
          # is unnecessary and can remove reusable build outputs.
          flutter pub get
          flutter build apk "--$BUILD_TYPE"

      - name: Locate APK
        run: |
          set -e
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_NAME="app-debug.apk"
          else
            APK_NAME="app-release.apk"
          fi
          APK_PATH=$(find "$PROJECT_ROOT" -type f -name "$APK_NAME" -path "*/flutter-apk/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::$APK_NAME tidak ditemukan setelah build $BUILD_TYPE."
            find "$PROJECT_ROOT/build" -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Found APK at: $APK_PATH"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
