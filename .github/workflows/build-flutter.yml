name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build/job ID"
        required: true
        type: string

      userId:
        description: "User ID"
        required: false
        default: "0"
        type: string

      payload:
        description: "JSON build payload"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: scbuild-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # PAYLOAD
      # ==========================================================

      - name: Parse payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["PAYLOAD"])

          mode = str(data.get("mode", "zip")).lower()
          build_type = str(
              data.get("buildType", "release")
          ).lower()

          url = str(
              data.get("url", "")
          ).strip()

          app_name = str(
              data.get("appName", "Web2APK")
          ).strip()

          icon_url = str(
              data.get("iconUrl", "")
          ).strip()

          if mode not in ("zip", "url"):
              raise SystemExit(
                  f"Unsupported mode: {mode}"
              )

          if build_type not in ("release", "debug"):
              build_type = "release"

          if not url:
              raise SystemExit(
                  "payload.url is required"
              )

          safe = "".join(
              c if c.isalnum() else "_"
              for c in app_name
          )

          safe = safe.strip("_") or "web2apk"

          if safe[0].isdigit():
              safe = "app_" + safe

          safe = safe[:40].lower()

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:

              f.write(f"mode={mode}\n")
              f.write(f"build_type={build_type}\n")
              f.write(f"url={url}\n")
              f.write(f"app_name={app_name}\n")
              f.write(f"icon_url={icon_url}\n")
              f.write(f"project_name={safe}\n")
          PY

      # ==========================================================
      # PACKAGES
      # ==========================================================

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            jq \
            python3 \
            file \
            imagemagick

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # FLUTTER
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check environment
        run: |
          flutter --version
          dart --version
          java -version

      # ==========================================================
      # ZIP BUILD
      # ==========================================================

      - name: Download source ZIP
        if: steps.payload.outputs.mode == 'zip'
        env:
          SOURCE_URL: ${{ steps.payload.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/input"
          mkdir -p "$GITHUB_WORKSPACE/project"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$SOURCE_URL" \
            -o "$GITHUB_WORKSPACE/input/source.zip"

          test -s "$GITHUB_WORKSPACE/input/source.zip"

          unzip -q \
            "$GITHUB_WORKSPACE/input/source.zip" \
            -d "$GITHUB_WORKSPACE/project"

          ROOT="$(
            find \
              "$GITHUB_WORKSPACE/project" \
              -name pubspec.yaml \
              -type f \
              -print -quit |
            xargs -r dirname
          )"

          if [ -z "${ROOT:-}" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            find "$GITHUB_WORKSPACE/project" \
              -maxdepth 5 \
              -type f |
              head -300
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" \
            >> "$GITHUB_ENV"

          echo "Project: $ROOT"

      # ==========================================================
      # URL BUILD
      # ==========================================================

      - name: Create Web2APK project
        if: steps.payload.outputs.mode == 'url'
        env:
          PROJECT_NAME: ${{ steps.payload.outputs.project_name }}
          APP_NAME: ${{ steps.payload.outputs.app_name }}
          TARGET_URL: ${{ steps.payload.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          flutter create \
            --platforms=android \
            "$PROJECT_NAME"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/$PROJECT_NAME" \
            >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE/$PROJECT_NAME"

          flutter pub add webview_flutter

          python3 - <<'PY'
          from pathlib import Path
          import os

          url = os.environ["TARGET_URL"]
          app = os.environ["APP_NAME"]

          url = url.replace("\\", "\\\\").replace("'", "\\'")
          app = app.replace("\\", "\\\\").replace("'", "\\'")

          code = f"""
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {{
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebApp());
          }}

          class WebApp extends StatefulWidget {{
            const WebApp({{super.key}});

            @override
            State<WebApp> createState() => _WebAppState();
          }}

          class _WebAppState extends State<WebApp> {{
            late final WebViewController controller;

            @override
            void initState() {{
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted
                )
                ..loadRequest(
                  Uri.parse('{url}')
                );
            }}

            @override
            Widget build(BuildContext context) {{
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '{app}',
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(
                      controller: controller
                    ),
                  ),
                ),
              );
            }}
          }}
          """

          Path("lib/main.dart").write_text(
              code,
              encoding="utf-8"
          )
          PY

      # ==========================================================
      # CRITICAL GRADLE FIX
      # ==========================================================

      - name: Repair Android Gradle properties
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          mkdir -p android

          PROPERTY_FILE="android/gradle.properties"

          if [ -f "$PROPERTY_FILE" ]; then

            # Normalize CRLF -> LF
            sed -i 's/\r$//' "$PROPERTY_FILE"

          else

            touch "$PROPERTY_FILE"

          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")

          if p.exists():
              raw = p.read_text(
                  encoding="utf-8",
                  errors="replace"
              )
          else:
              raw = ""

          # Normalize all line endings.
          raw = raw.replace("\r\n", "\n")
          raw = raw.replace("\r", "\n")

          # Fix the exact corruption caused by previous workflow.
          raw = raw.replace(
              "falseandroid.newDsl=false",
              "false\nandroid.newDsl=false"
          )

          raw = raw.replace(
              "falseandroid.builtInKotlin=false",
              "false\nandroid.builtInKotlin=false"
          )

          # Remove existing versions of the properties.
          lines = []

          for line in raw.split("\n"):

              stripped = line.strip()

              if stripped.startswith(
                  "android.newDsl="
              ):
                  continue

              if stripped.startswith(
                  "android.builtInKotlin="
              ):
                  continue

              lines.append(line)

          # Remove trailing blank lines.
          while lines and not lines[-1].strip():
              lines.pop()

          # Add clean properties.
          lines.append(
              "android.newDsl=false"
          )

          lines.append(
              "android.builtInKotlin=false"
          )

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
              newline="\n"
          )
          PY

          echo ""
          echo "========== gradle.properties =========="
          cat -n android/gradle.properties
          echo "======================================="

          # Verify that values are actually valid.
          if grep -q \
            "android.enableJetifier=falseandroid" \
            android/gradle.properties; then

            echo "::error::gradle.properties masih corrupt."
            exit 1
          fi

          if ! grep -qx \
            "android.newDsl=false" \
            android/gradle.properties; then

            echo "::error::android.newDsl=false tidak ditemukan."
            exit 1
          fi

      # ==========================================================
      # ANDROID CONFIG
      # ==========================================================

      - name: Configure Android
        env:
          APP_NAME: ${{ steps.payload.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          name = os.environ["APP_NAME"]

          name = (
              name
              .replace("\\", "\\\\")
              .replace('"', '\\"')
          )

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():

              s = manifest.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'android:label="[^"]*"',
                  f'android:label="{name}"',
                  s,
                  count=1
              )

              manifest.write_text(
                  s,
                  encoding="utf-8"
              )

          gradle = Path(
              "android/app/build.gradle"
          )

          if gradle.exists():

              s = gradle.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'minSdkVersion\s+\d+',
                  'minSdkVersion 21',
                  s
              )

              gradle.write_text(
                  s,
                  encoding="utf-8"
              )

          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          if gradle_kts.exists():

              s = gradle_kts.read_text(
                  encoding="utf-8"
              )

              s = re.sub(
                  r'minSdk\s*=\s*\d+',
                  'minSdk = 21',
                  s
              )

              gradle_kts.write_text(
                  s,
                  encoding="utf-8"
              )
          PY

      # ==========================================================
      # GRADLE CACHE
      # ==========================================================

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ==========================================================
      # FLUTTER
      # ==========================================================

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter clean

          rm -rf .dart_tool
          rm -rf build

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter pub get

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug \
              --no-tree-shake-icons

          else

            flutter build apk \
              --release \
              --no-tree-shake-icons

          fi

      # ==========================================================
      # COLLECT
      # ==========================================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(
            find \
              "$PROJECT_ROOT/build/app/outputs/flutter-apk" \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "${APK:-}" ]; then

            echo "::error::APK tidak ditemukan."

            find \
              "$PROJECT_ROOT/build" \
              -type f 2>/dev/null |
            head -300

            exit 1
          fi

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

          echo "APK=$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk" \
            >> "$GITHUB_ENV"

          ls -lh \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/app-${{ inputs.jobId }}.apk
          if-no-files-found: error
          retention-days: 3

      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SCBUILD DAZZ"
            echo ""
            echo "- Job ID: \`${JOB_ID}\`"
            echo "- User ID: \`${USER_ID}\`"
            echo "- Mode: \`${{ steps.payload.outputs.mode }}\`"
            echo "- Build type: \`${{ steps.payload.outputs.build_type }}\`"

            if [ -f "${APK:-}" ]; then
              echo "- APK size: $(du -h "$APK" | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
