name: SCBUILD DAZZ

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Build Job ID"
        required: true
        type: string
      userId:
        description: "User ID"
        required: false
        default: "0"
        type: string
      payload:
        description: "Build payload JSON"
        required: true
        type: string

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.11.1"
  FLUTTER_VERSION: "3.35.7"

concurrency:
  group: scbuild-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}

    steps:
      # Tidak perlu checkout: source APK datang dari payload.url.

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: scbuild-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            scbuild-pub-${{ runner.os }}-

      - name: Cache manual Gradle
        uses: actions/cache@v4
        with:
          path: ~/.cache/scbuild/gradle-${{ env.GRADLE_VERSION }}
          key: scbuild-gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Parse payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["PAYLOAD"])
          mode = str(data.get("mode", "zip")).strip().lower()
          url = str(data.get("url", "")).strip()
          build_type = str(data.get("buildType", "release")).strip().lower()
          if mode != "zip":
              raise SystemExit("payload.mode must be zip")
          if not url:
              raise SystemExit("payload.url is required")
          if build_type not in ("release", "debug"):
              build_type = "release"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"mode={mode}\n")
              f.write(f"url={url}\n")
              f.write(f"build_type={build_type}\n")
          PY

      - name: Download source ZIP
        env:
          SOURCE_URL: ${{ steps.payload.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/input" "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/input" "$GITHUB_WORKSPACE/project"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 900 \
            "$SOURCE_URL" -o "$GITHUB_WORKSPACE/input/source.zip"
          test -s "$GITHUB_WORKSPACE/input/source.zip"
          unzip -q "$GITHUB_WORKSPACE/input/source.zip" -d "$GITHUB_WORKSPACE/project"

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find "$GITHUB_WORKSPACE/project" -type f -name "pubspec.yaml" -not -path "*/.dart_tool/*" -print -quit | xargs -r dirname)"
          if [ -z "${ROOT:-}" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$ROOT"

      - name: Prepare Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [ ! -d "android" ]; then
            echo "::error::Folder android tidak ditemukan."
            exit 1
          fi
          touch android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle.properties")
          text = p.read_text(encoding="utf-8", errors="replace").replace("\r\n", "\n").replace("\r", "\n")
          lines = []
          for line in text.splitlines():
              s = line.strip()
              if s.startswith("android.newDsl=") or s.startswith("android.builtInKotlin="):
                  continue
              lines.append(line)
          lines.append("android.newDsl=false")
          lines.append("android.builtInKotlin=false")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -x "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "Source Gradle wrapper exists."
            exit 0
          fi

          GRADLE_VERSION="${GRADLE_VERSION}"
          GRADLE_HOME="$HOME/.cache/scbuild/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$HOME/.cache/scbuild/gradle-$GRADLE_VERSION.zip"
          GRADLE_TMP="$HOME/.cache/scbuild/gradle-unpack-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            rm -rf "$GRADLE_TMP"
            mkdir -p "$GRADLE_TMP" "$(dirname "$GRADLE_HOME")"

            if [ ! -s "$GRADLE_ZIP" ]; then
              curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
                --connect-timeout 20 --max-time 900 \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                -o "$GRADLE_ZIP"
            fi

            unzip -q -o "$GRADLE_ZIP" -d "$GRADLE_TMP"
            rm -rf "$GRADLE_HOME"
            mkdir -p "$GRADLE_HOME"
            cp -a "$GRADLE_TMP/gradle-$GRADLE_VERSION/." "$GRADLE_HOME/"
            rm -rf "$GRADLE_TMP"
          fi

          test -x "$GRADLE_HOME/bin/gradle"
          echo "GRADLE_HOME=$GRADLE_HOME" >> "$GITHUB_ENV"

          mkdir -p android/gradle/wrapper
          cat > android/gradlew <<EOF
          #!/bin/sh
          set -e
          exec "$GRADLE_HOME/bin/gradle" "\$@"
          EOF
          chmod +x android/gradlew

          "$GRADLE_HOME/bin/gradle" --version

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --no-tree-shake-icons
          else
            flutter build apk --release --no-tree-shake-icons
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          APK="$(find "$PROJECT_ROOT/build/app/outputs/flutter-apk" -type f -name "*.apk" -print -quit)"
          if [ -z "${APK:-}" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"
          echo "APK=$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/app-${{ inputs.jobId }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SCBUILD DAZZ"
            echo ""
            echo "- Job ID: \`${JOB_ID}\`"
            echo "- User ID: \`${USER_ID}\`"
            echo "- Mode: \`${{ steps.payload.outputs.mode }}\`"
            echo "- Build type: \`${{ steps.payload.outputs.build_type }}\`"
            if [ -n "${APK:-}" ] && [ -f "$APK" ]; then
              echo "- APK size: $(du -h "$APK" | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
