name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build/job ID"
        required: true
        type: string

      userId:
        description: "User ID"
        required: false
        default: "0"
        type: string

      payload:
        description: "JSON build payload"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: scbuild-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # PARSE PAYLOAD
      # ============================================================

      - name: Parse payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["PAYLOAD"])

          mode = str(data.get("mode", "zip")).lower()
          build_type = str(data.get("buildType", "release")).lower()
          url = str(data.get("url", "")).strip()
          app_name = str(data.get("appName", "Web2APK")).strip()

          if mode not in ("zip", "url"):
              raise SystemExit(f"Unsupported mode: {mode}")

          if build_type not in ("release", "debug"):
              build_type = "release"

          if not url:
              raise SystemExit("payload.url is required")

          safe = "".join(
              c if c.isalnum() else "_"
              for c in app_name
          )

          safe = safe.strip("_") or "web2apk"

          if safe[0].isdigit():
              safe = "app_" + safe

          safe = safe[:40].lower()

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mode={mode}\n")
              f.write(f"build_type={build_type}\n")
              f.write(f"url={url}\n")
              f.write(f"app_name={app_name}\n")
              f.write(f"project_name={safe}\n")
          PY


      # ============================================================
      # SYSTEM
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            wget \
            jq \
            python3 \
            file


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========== FLUTTER =========="
          flutter --version

          echo "========== JAVA =========="
          java -version


      # ============================================================
      # DOWNLOAD SOURCE
      # ============================================================

      - name: Download source ZIP
        if: steps.payload.outputs.mode == 'zip'

        env:
          SOURCE_URL: ${{ steps.payload.outputs.url }}

        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/input"
          mkdir -p "$GITHUB_WORKSPACE/project"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$SOURCE_URL" \
            -o "$GITHUB_WORKSPACE/input/source.zip"

          test -s "$GITHUB_WORKSPACE/input/source.zip"

          unzip -q \
            "$GITHUB_WORKSPACE/input/source.zip" \
            -d "$GITHUB_WORKSPACE/project"

          ROOT="$(
            find "$GITHUB_WORKSPACE/project" \
              -name pubspec.yaml \
              -type f \
              -print \
              -quit |
              xargs -r dirname
          )"

          if [ -z "${ROOT:-}" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "PROJECT_ROOT=$ROOT"


      # ============================================================
      # URL MODE
      # ============================================================

      - name: Create Web2APK project
        if: steps.payload.outputs.mode == 'url'

        env:
          PROJECT_NAME: ${{ steps.payload.outputs.project_name }}
          APP_NAME: ${{ steps.payload.outputs.app_name }}
          TARGET_URL: ${{ steps.payload.outputs.url }}

        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          flutter create \
            --platforms=android \
            "$PROJECT_NAME"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/$PROJECT_NAME" >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE/$PROJECT_NAME"

          flutter pub add webview_flutter

          python3 - <<'PY'
          from pathlib import Path
          import os

          url = os.environ["TARGET_URL"]
          app = os.environ["APP_NAME"]

          url = url.replace("\\", "\\\\").replace("'", "\\'")
          app = app.replace("\\", "\\\\").replace("'", "\\'")

          Path("lib/main.dart").write_text(
              f"""
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {{
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebApp());
          }}

          class WebApp extends StatefulWidget {{
            const WebApp({{super.key}});

            @override
            State<WebApp> createState() => _WebAppState();
          }}

          class _WebAppState extends State<WebApp> {{
            late final WebViewController controller;

            @override
            void initState() {{
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted
                )
                ..loadRequest(
                  Uri.parse('{url}')
                );
            }}

            @override
            Widget build(BuildContext context) {{
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '{app}',
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(
                      controller: controller,
                    ),
                  ),
                ),
              );
            }}
          }}
          """,
              encoding="utf-8"
          )
          PY


      # ============================================================
      # PREPARE GRADLE
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          mkdir -p android/gradle/wrapper

          # --------------------------------------------------------
          # Keep the project's AGP configuration.
          # Only make Gradle wrapper compatible.
          # --------------------------------------------------------

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF


          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          touch android/gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")

          text = p.read_text(
              encoding="utf-8",
              errors="replace"
          )

          text = text.replace("\r\n", "\n")
          text = text.replace("\r", "\n")

          # Fix accidental concatenation only.
          text = text.replace(
              "falseandroid.newDsl=false",
              "false\nandroid.newDsl=false"
          )

          text = text.replace(
              "falseandroid.builtInKotlin=false",
              "false\nandroid.builtInKotlin=false"
          )

          # Remove duplicate values.
          lines = []

          for line in text.split("\n"):
              stripped = line.strip()

              if stripped.startswith("android.newDsl="):
                  continue

              if stripped.startswith("android.builtInKotlin="):
                  continue

              lines.append(line)

          while lines and not lines[-1].strip():
              lines.pop()

          # Flutter's error explicitly asks for opt-out.
          lines.append("android.newDsl=false")
          lines.append("android.builtInKotlin=false")

          p.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY


          # --------------------------------------------------------
          # Create wrapper launcher if source ZIP has no gradlew.
          # --------------------------------------------------------

          if [ ! -f android/gradlew ]; then

            cat > android/gradlew <<'EOF'
          #!/bin/sh

          set -e

          GRADLE_HOME="${RUNNER_TEMP}/gradle-fixed"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            echo "Gradle 8.11.1 belum tersedia."
            exit 1
          fi

          exec "$GRADLE_HOME/bin/gradle" "$@"
          EOF

            chmod +x android/gradlew

          fi


          # --------------------------------------------------------
          # Download Gradle 8.11.1
          # --------------------------------------------------------

          mkdir -p "$RUNNER_TEMP/gradle-fixed"

          if [ ! -x "$RUNNER_TEMP/gradle-fixed/bin/gradle" ]; then

            curl \
              -fL \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 900 \
              "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" \
              -o "$RUNNER_TEMP/gradle.zip"

            rm -rf "$RUNNER_TEMP/gradle-fixed"

            unzip -q \
              "$RUNNER_TEMP/gradle.zip" \
              -d "$RUNNER_TEMP"

            mv \
              "$RUNNER_TEMP/gradle-8.11.1" \
              "$RUNNER_TEMP/gradle-fixed"

          fi


          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------

          echo ""
          echo "========== GRADLE =========="

          "$RUNNER_TEMP/gradle-fixed/bin/gradle" --version

          echo ""
          echo "========== PROPERTIES =========="

          cat android/gradle.properties

          echo ""
          echo "========== WRAPPER =========="

          cat android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle preparation OK."


      # ============================================================
      # ANDROID CONFIG
      # ============================================================

      - name: Configure Android
        env:
          APP_NAME: ${{ steps.payload.outputs.app_name }}

        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          name = os.environ["APP_NAME"]

          name = (
              name
              .replace("\\", "\\\\")
              .replace('"', '\\"')
          )

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():

              s = manifest.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              s = re.sub(
                  r'android:label="[^"]*"',
                  f'android:label="{name}"',
                  s,
                  count=1
              )

              manifest.write_text(
                  s,
                  encoding="utf-8"
              )


          gradle = Path(
              "android/app/build.gradle"
          )

          if gradle.exists():

              s = gradle.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              s = re.sub(
                  r'minSdkVersion\s+\d+',
                  'minSdkVersion 21',
                  s
              )

              gradle.write_text(
                  s,
                  encoding="utf-8"
              )


          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          if gradle_kts.exists():

              s = gradle_kts.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              s = re.sub(
                  r'minSdk\s*=\s*\d+',
                  'minSdk = 21',
                  s
              )

              gradle_kts.write_text(
                  s,
                  encoding="utf-8"
              )
          PY


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter clean

          rm -rf .dart_tool
          rm -rf build


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter pub get


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}

        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug \
              --no-tree-shake-icons

          else

            flutter build apk \
              --release \
              --no-tree-shake-icons

          fi


      # ============================================================
      # COLLECT
      # ============================================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(
            find "$PROJECT_ROOT/build/app/outputs/flutter-apk" \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "${APK:-}" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"

          echo \
            "APK=$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk" \
            >> "$GITHUB_ENV"

          ls -lh \
            "$GITHUB_WORKSPACE/output/app-${JOB_ID}.apk"


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: apk-${{ inputs.jobId }}

          path: output/app-${{ inputs.jobId }}.apk

          if-no-files-found: error
          retention-days: 3


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SCBUILD DAZZ"
            echo ""
            echo "- Job ID: \`${JOB_ID}\`"
            echo "- User ID: \`${USER_ID}\`"
            echo "- Mode: \`${{ steps.payload.outputs.mode }}\`"
            echo "- Build type: \`${{ steps.payload.outputs.build_type }}\`"

            if [ -f "${APK:-}" ]; then
              echo "- APK size: $(du -h "$APK" | cut -f1)"
            fi

          } >> "$GITHUB_STEP_SUMMARY"
